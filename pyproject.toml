[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "comment-analyzer"
dynamic = ["version"]
description = "Windows desktop app: paste a link to a YouTube, Facebook, Instagram or TikTok post and analyse its comments."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6-WebEngine>=6.12",  # also installs PySide6-Addons and PySide6-Essentials
    "platformdirs>=4.14",
    "keyring>=25.7",
    "httpx2>=2.16",
    "tzdata>=2026.6",
    "onnxruntime>=1.31",
    "tokenizers>=0.23",
    "numpy>=2.5",
    "fast-langdetect>=1.1",
    "plotly>=7.1",
    "matplotlib>=3.11",
    "python-docx>=1.2",
    "openpyxl>=3.1.5",
    "anthropic>=2.8.0",
]

[project.gui-scripts]
comment-analyzer = "comment_analyzer.app:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-qt>=4.5",
    "ruff>=0.17",
    "mypy>=2.4",
    "pyinstaller>=6.22",
    "pyinstaller-hooks-contrib>=2026.10",
    "vadersentiment>=3.3.2",
]

[tool.hatch.version]
path = "src/comment_analyzer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/comment_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py313"  # keeps `except (A, B):` parenthesized, as editors and readers expect
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # tables of long example URLs

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "vaderSentiment.*", "openpyxl", "openpyxl.*"]  # untyped
ignore_missing_imports = true
